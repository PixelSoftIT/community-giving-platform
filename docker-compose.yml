version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: communitygiving
      POSTGRES_USER: communitygiving_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    # No ports published to the host — only reachable by other containers on this network

  api:
    build:
      context: ./backend/CommunityGiving.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=communitygiving;Username=communitygiving_app;Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: CommunityGivingApi
      Jwt__Audience: CommunityGivingClient
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      Email__SmtpHost: ${SMTP_HOST}
      Email__SmtpPort: ${SMTP_PORT}
      Email__SmtpUsername: ${SMTP_USERNAME}
      Email__SmtpPassword: ${SMTP_PASSWORD}
      Email__FromAddress: ${SMTP_FROM_ADDRESS}
      Email__FromName: ${SMTP_FROM_NAME}
      Sms__TwilioAccountSid: ${TWILIO_ACCOUNT_SID}
      Sms__TwilioAuthToken: ${TWILIO_AUTH_TOKEN}
      Sms__TwilioFromNumber: ${TWILIO_FROM_NUMBER}
      AllowedOrigins__0: ${PUBLIC_APP_URL}
    depends_on:
      - db
    networks:
      - internal
    expose:
      - "8080"

  client:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "80"

  # Edge reverse proxy: terminates TLS, routes app.yourorg.org -> client, api.yourorg.org -> api
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - api
      - client
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"

networks:
  internal:

volumes:
  db_data:
  certbot_www:
  certbot_certs:
