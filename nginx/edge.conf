# --- HTTP: redirect to HTTPS, except Let's Encrypt challenge path ---
server {
    listen 80;
    server_name app.yourorg.org api.yourorg.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Frontend (React SPA) ---
server {
    listen 443 ssl;
    server_name app.yourorg.org;

    ssl_certificate     /etc/letsencrypt/live/app.yourorg.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourorg.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Backend API ---
server {
    listen 443 ssl;
    server_name api.yourorg.org;

    ssl_certificate     /etc/letsencrypt/live/api.yourorg.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourorg.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 5m;

    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stripe webhook needs the raw body — same proxy_pass works, just documented here
    # so it's not accidentally routed differently later.
    location /api/payments/webhook {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
}
